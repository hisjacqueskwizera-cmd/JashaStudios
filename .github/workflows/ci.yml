name: Foundation CI

on:
  push:
    branches: [main, phase-1-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  python:
    name: Python service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  python-container:
    name: Python production image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build --pull --tag jasha-vision-api:ci ./python-service
      - name: Run container and verify production readiness
        shell: bash
        run: |
          docker run --detach --name jasha-vision-api-ci \
            --publish 10000:10000 \
            --env APP_ENV=production \
            --env VISION_API_KEY=ci-smoke-test-only \
            --env PORT=10000 \
            jasha-vision-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:10000/health/ready; then
              docker stop jasha-vision-api-ci
              exit 0
            fi
            sleep 1
          done
          docker logs jasha-vision-api-ci
          docker stop jasha-vision-api-ci || true
          exit 1
